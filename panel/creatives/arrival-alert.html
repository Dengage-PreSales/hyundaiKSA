<!-- dauto_demo_arrival-alert | Content type: Popup (custom HTML).
     A capture form. The engine's native mechanism does the work: inputs are
     read through data-dn-form-id, Dn.postSubscription validates and creates
     the contact with its consent flags. No script tags, no form post. -->
<style>
  #hyx-arr { font-family: 'Outfit', Arial, sans-serif; background: #fff; color: #0e1215; border-radius: 6px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.22); max-width: 420px; }
  #hyx-arr .m img { display: block; width: 100%; height: auto; }
  #hyx-arr .b { padding: 20px 22px; }
  #hyx-arr .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #e63312; font-weight: 700; }
  #hyx-arr h2 { margin: 6px 0 4px; font-size: 19px; color: #002c5f; }
  #hyx-arr .ar { font-size: 14px; color: #002c5f; margin: 0 0 8px; direction: rtl; }
  #hyx-arr p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #3a3f43; }
  #hyx-arr input { width: 100%; box-sizing: border-box; border: 1px solid #d9dde1; border-radius: 4px; padding: 11px 12px; font: inherit; font-size: 13.5px; margin-bottom: 10px; }
  #hyx-arr input[data-dn-invalid="true"] { border-color: #e63312; }
  #hyx-arr .cta { width: 100%; border: 0; background: #002c5f; color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 12px 16px; border-radius: 4px; cursor: pointer; }
  #hyx-arr .fine { font-size: 11px; color: #6e7275; margin-top: 8px; }
  #hyx-arr .done { display: none; padding: 8px 0 2px; color: #10633f; font-size: 13.5px; }
  #hyx-arr .container[data-dn-is-submitted="true"] .done { display: block; }
  #hyx-arr .container[data-dn-is-submitted="true"] .hide-after { display: none; }
</style>
<div id="hyx-arr">
  <div class="m">
    <img src="https://dengage-presales.github.io/hyundaiKSA/assets/brand/scene-suv-2.svg" alt="D·Auto RIDGE">
  </div>
  <div class="b container">
    <span class="k">Arrival alert</span>
    <h2>Be first when the new RIDGE lands</h2>
    <p class="ar">كن أول من يعرف عند وصولها</p>
    <div class="hide-after">
      <p>Leave your details and we will message you the moment it reaches your branch.</p>
      <input type="email" data-dn-form-id="email" placeholder="Email address" data-dn-validation="email" data-dn-required="true">
      <input type="tel" data-dn-form-id="phone" placeholder="Mobile (+9665...)" dir="ltr">
      <button type="button" class="cta" onclick="Dn.postSubscription(); Dn.sendClick('subscribe');">Notify me</button>
      <p class="fine">By subscribing you agree to receive updates from this demo. Unsubscribe any time.</p>
    </div>
    <p class="done">Done. We will let you know the moment it arrives.</p>
  </div>
</div>
