<!-- dauto_demo_newsletter-capture | Content type: Popup (custom HTML).
     The D·Auto-branded subscription capture. Same native mechanism as
     arrival-alert: data-dn-form-id inputs, Dn.postSubscription. -->
<style>
  #hyx-news { font-family: 'Outfit', Arial, sans-serif; background: #fff; color: #0e1215; border-radius: 6px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.22); max-width: 420px; }
  #hyx-news .head { background: #002c5f; color: #fff; padding: 22px 22px 18px; }
  #hyx-news .head h2 { margin: 0 0 4px; font-size: 19px; }
  #hyx-news .head .ar { font-size: 14px; opacity: .9; margin: 0; direction: rtl; }
  #hyx-news .b { padding: 18px 22px 20px; }
  #hyx-news p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #3a3f43; }
  #hyx-news input { width: 100%; box-sizing: border-box; border: 1px solid #d9dde1; border-radius: 4px; padding: 11px 12px; font: inherit; font-size: 13.5px; margin-bottom: 10px; }
  #hyx-news input[data-dn-invalid="true"] { border-color: #e63312; }
  #hyx-news .cta { width: 100%; border: 0; background: #002c5f; color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 12px 16px; border-radius: 4px; cursor: pointer; }
  #hyx-news .fine { font-size: 11px; color: #6e7275; margin-top: 8px; }
  #hyx-news .done { display: none; color: #10633f; font-size: 13.5px; padding-top: 8px; }
  #hyx-news .container[data-dn-is-submitted="true"] .done { display: block; }
  #hyx-news .container[data-dn-is-submitted="true"] .hide-after { display: none; }
</style>
<div id="hyx-news">
  <div class="head">
    <h2>New models, offers and launch news first</h2>
    <p class="ar">اشترك ليصلك جديد دي أوتو أولاً</p>
  </div>
  <div class="b container">
    <div class="hide-after">
      <p>One or two emails a month. The good stuff only.</p>
      <input type="email" data-dn-form-id="email" placeholder="Email address" data-dn-validation="email" data-dn-required="true">
      <button type="button" class="cta" onclick="Dn.postSubscription(); Dn.sendClick('newsletter-subscribe');">Subscribe</button>
      <p class="fine">By subscribing you agree to receive updates from this demo. Unsubscribe any time.</p>
    </div>
    <p class="done">Welcome aboard. Watch your inbox.</p>
  </div>
</div>
